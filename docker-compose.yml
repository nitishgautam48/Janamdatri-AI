# Local-only dev setup: the app (this repo's existing Dockerfile) plus a
# GPU-accelerated Ollama instance it talks to for general chat responses
# (src/llm_chat.py) - the danger-sign/self-harm safety gate in
# src/dynamic_eval/chat_assistant.py stays rule-based regardless; see that
# module's docstring. Not meant for a real deployment - see Dockerfile's
# own comments for the production/Hindi-STT build path, which is separate.
#
# Needs Docker Desktop's WSL2 GPU support turned on (Settings -> Resources
# -> WSL Integration, and Settings -> General -> "Use the WSL 2 based
# engine") - recent Docker Desktop passes an NVIDIA GPU through to WSL2
# containers with no separate driver install inside WSL. Verify it works
# BEFORE relying on it:
#   docker run --rm --gpus=all nvidia/cuda:12.3.1-base-ubuntu22.04 nvidia-smi
# If that doesn't show your GPU, Ollama will silently fall back to CPU
# inference - fix the GPU passthrough first rather than debugging slow
# responses later.
#
# Usage:
#   docker compose up -d ollama
#   docker exec -it janamdatri-ai-ollama-1 ollama pull deepseek-r1:7b
#   docker compose up -d app
# (pulling the model before starting `app` isn't required - app just calls
# whatever model OLLAMA_MODEL names at request time - but doing it first
# means your first chat message in the UI isn't the one eating the
# multi-GB download.)
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=deepseek-r1:7b
    volumes:
      - app-data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
  # A Docker-managed volume, not a host bind mount (`./data:/app/data`) -
  # SQLite needs real POSIX file locking, which a Windows-drive bind mount
  # into a Linux container doesn't support reliably through Docker
  # Desktop's file sharing, and reliably produces "disk I/O error" at
  # startup (auth.init_db()'s very first write). A named volume lives on
  # the Linux VM's own filesystem instead, where SQLite's locking actually
  # works - at the cost of the data no longer being directly Explorer-
  # browsable from Windows, same tradeoff as ollama-models above already
  # makes for the pulled model weights.
  app-data:
